{% extends "marketplace/base.html" %}
{% block title %}Entrar | IESB Marketplace{% endblock %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">IESB MARKETPLACE</p>
  <h1>Entrar</h1>
  {% if form.errors %}<p class="message error">Usuário ou senha inválidos.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
